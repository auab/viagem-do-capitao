<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Da pilha à mesa: RAG a bordo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #E4ECF0; --surface: #F6F9FA; --ink: #10304A; --muted: #4C6577; --line: #B5C7D2;
    --navy: #1B4F77; --sun: #E3A50B; --ok: #1E7656; --ok-soft: #DCEFE6; --bad: #AF3329; --bad-soft: #F6E1DE;
    --focus: #E3A50B;
    --display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
    --body: "Atkinson Hyperlegible", "Segoe UI", Verdana, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0C1C29; --surface: #132838; --ink: #E3ECF1; --muted: #9BB1C0; --line: #2B4558;
      --navy: #79AEDB; --sun: #F0B83A; --ok: #5CC59A; --ok-soft: #173B30; --bad: #E87467; --bad-soft: #43231F;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0C1C29; --surface: #132838; --ink: #E3ECF1; --muted: #9BB1C0; --line: #2B4558;
    --navy: #79AEDB; --sun: #F0B83A; --ok: #5CC59A; --ok-soft: #173B30; --bad: #E87467; --bad-soft: #43231F;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 1.125rem; line-height: 1.55; }
  img, svg { max-width: 100%; }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  a { color: var(--navy); }

  .bar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; max-width: 880px; margin: 0 auto; padding: 1.1rem 1.25rem 0; flex-wrap: wrap; }
  .brand { font-family: var(--display); font-weight: 800; font-size: 1.35rem; letter-spacing: .02em; color: var(--navy); }
  .tabs { display: none; gap: .25rem; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: .2rem; }
  .tabs.on { display: flex; }
  .tabs button { border: 0; background: transparent; padding: .4rem .9rem; border-radius: 999px; cursor: pointer; font-size: .95rem; }
  .tabs button[aria-pressed="true"] { background: var(--navy); color: var(--surface); }

  .stages { max-width: 880px; margin: 0 auto; padding: .9rem 1.25rem 0; }
  .stages ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: .4rem; }
  .stages button { width: 100%; text-align: left; background: transparent; border: 0; border-top: 4px solid var(--line); padding: .45rem .2rem 0; cursor: pointer; color: var(--muted); font-size: .92rem; line-height: 1.3; }
  .stages button .n { display: block; font-family: var(--display); font-weight: 800; font-size: 1.15rem; color: inherit; }
  .stages button.done { border-top-color: var(--navy); }
  .stages button[aria-current="step"] { border-top-color: var(--sun); color: var(--ink); font-weight: 700; }
  @media (max-width: 560px) { .stages .t { display: none; } }

  main { max-width: 880px; margin: 0 auto; padding: 1.25rem 1.25rem 4rem; }
  h1 { font-family: var(--display); font-weight: 800; font-size: clamp(3rem, 9vw, 5.6rem); line-height: .92; letter-spacing: .005em; margin: 1.5rem 0 1.25rem; }
  h2 { font-family: var(--display); font-weight: 700; font-size: clamp(2rem, 5vw, 3rem); line-height: 1.02; margin: .4rem 0 1.25rem; }
  h3 { font-size: 1.15rem; margin: 0 0 .35rem; }
  p { margin: 0 0 1rem; max-width: 64ch; }
  .lead { font-size: 1.25rem; }
  .muted { color: var(--muted); }

  .route { width: 100%; height: auto; display: block; margin: .5rem 0 1rem; }
  .route .wave { stroke: var(--line); } .route .path { stroke: var(--navy); }
  .route .stop { fill: var(--surface); stroke: var(--navy); } .route .stop.done { fill: var(--navy); }
  .route .port { fill: var(--sun); } .route .hull { fill: var(--ink); } .route .sail { fill: var(--surface); stroke: var(--ink); }
  .route text { fill: var(--muted); font-family: var(--body); font-size: 13px; }
  .ship { transition: transform .6s cubic-bezier(.4,.1,.2,1); }
  @media (prefers-reduced-motion: reduce) { .ship { transition: none; } }

  .btn { display: inline-flex; align-items: center; gap: .5rem; background: var(--navy); color: var(--surface); border: 0; border-radius: 6px; padding: .8rem 1.4rem; font-weight: 700; font-size: 1.1rem; cursor: pointer; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--navy); border: 2px solid var(--navy); }
  .btn.danger { background: transparent; color: var(--bad); border: 2px solid var(--bad); }
  .actions { margin-top: 1.5rem; display: flex; gap: .75rem; flex-wrap: wrap; align-items: center; }

  .legend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .6rem 1.5rem; margin: 1.5rem 0 2rem; padding: 0; list-style: none; }
  .legend li { display: flex; gap: .75rem; align-items: center; }
  @media (max-width: 560px) { .legend { grid-template-columns: 1fr; } }
  .flag { flex: 0 0 auto; width: 44px; height: 32px; border-radius: 2px; box-shadow: 0 0 0 1px rgba(0,0,0,.18); }

  .step { color: var(--muted); font-size: 1rem; margin: 0; }
  .ask { color: var(--muted); margin: -.6rem 0 1.1rem; }
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
  @media (max-width: 640px) { .options { grid-template-columns: 1fr; } }
  .opt { display: flex; align-items: center; gap: .9rem; text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 8px; padding: .85rem 1rem; cursor: pointer; min-height: 4.2rem; font-size: 1.05rem; }
  .opt:hover:not(:disabled) { border-color: var(--navy); }
  .opt:disabled { cursor: default; }
  .opt.picked { border-color: var(--navy); box-shadow: inset 0 0 0 2px var(--navy); }
  .opt.right { border-color: var(--ok); background: var(--ok-soft); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
  .opt.faded { opacity: .55; }
  .opt .tag { margin-left: auto; font-size: .85rem; font-weight: 700; white-space: nowrap; }
  .opt.right .tag { color: var(--ok); } .opt.wrong .tag { color: var(--bad); }
  .feedback { margin-top: 1.5rem; border-left: 5px solid var(--sun); background: var(--surface); padding: 1.1rem 1.25rem; border-radius: 0 8px 8px 0; }
  .feedback p:last-child { margin-bottom: 0; }
  .verdict { font-weight: 700; font-size: 1.2rem; margin-bottom: .6rem; }
  .verdict.ok { color: var(--ok); } .verdict.no { color: var(--bad); }

  .score { font-family: var(--display); font-weight: 800; font-size: clamp(2.4rem, 7vw, 4rem); line-height: 1; margin: 1rem 0 2.5rem; }
  .lessons { list-style: none; padding: 0; margin: 0 0 2rem; display: grid; gap: 1rem; }
  .lessons li { display: flex; gap: 1rem; align-items: flex-start; }
  .lessons p { margin: 0; }
  .boxed { background: var(--surface); border: 2px solid var(--navy); border-radius: 8px; padding: 1.25rem 1.4rem; }
  .boxed h2 { margin-top: 0; }
  .crew { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin: 1rem 0; }
  .crew div { border-top: 3px solid var(--sun); padding-top: .6rem; }
  .note { font-size: .95rem; color: var(--muted); margin-top: 1.75rem; }

  /* Stage 2 */
  .reading { border-left: 5px solid var(--navy); padding: .2rem 0 .2rem 1rem; margin: 0 0 2rem; }
  .pollq { margin: 0 0 2rem; }
  .pollq h3 { font-size: 1.3rem; margin-bottom: .8rem; }
  .reveal-name { font-family: var(--display); font-weight: 800; font-size: clamp(2.4rem, 8vw, 4.6rem); line-height: 1; margin: .6rem 0 1rem; color: var(--muted); }
  .reveal-name b { color: var(--sun); font-weight: 800; }
  .acronym { font-family: var(--display); font-weight: 800; font-size: clamp(3rem, 10vw, 6rem); line-height: 1; letter-spacing: .12em; color: var(--ink); margin: 0 0 1rem; }

  /* Stage 3 */
  .seq { list-style: none; margin: 0 0 1.5rem; padding: 0; display: grid; gap: .6rem; counter-reset: s; }
  .slot { display: flex; align-items: center; gap: .8rem; min-height: 3.6rem; border: 2px dashed var(--line); border-radius: 8px; padding: .5rem .8rem; color: var(--muted); }
  .slot .pos { font-family: var(--display); font-weight: 800; font-size: 1.6rem; width: 1.6rem; text-align: center; color: var(--muted); flex: 0 0 auto; }
  .slot.filled { border-style: solid; background: var(--surface); color: var(--ink); }
  .slot.good { border-color: var(--ok); background: var(--ok-soft); }
  .slot.badpos { border-color: var(--bad); }
  .slot .txt { flex: 1; }
  .mini { display: inline-flex; gap: .25rem; flex: 0 0 auto; }
  .mini button { width: 2.3rem; height: 2.3rem; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; cursor: pointer; font-size: 1rem; line-height: 1; }
  .mini button:disabled { opacity: .35; cursor: default; }
  .pool { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: .6rem; margin: 0 0 1rem; padding: 0; list-style: none; }
  .card { width: 100%; text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 8px; padding: .8rem 1rem; cursor: pointer; font-size: 1.02rem; box-shadow: 0 2px 0 var(--line); }
  .card:hover { border-color: var(--navy); }
  .card:disabled { cursor: default; opacity: .6; }
  .card:disabled:hover { border-color: var(--line); }
  .yours { font-size: .9rem; color: var(--muted); }
  .label-sm { font-size: .95rem; color: var(--muted); margin: 0 0 .5rem; }
  .steps { list-style: none; margin: 0 0 2rem; padding: 0; display: grid; gap: 1rem; }
  .steps li { display: grid; grid-template-columns: 2.4rem 1fr; gap: .2rem .9rem; border-top: 1px solid var(--line); padding-top: 1rem; }
  .steps .num { font-family: var(--display); font-weight: 800; font-size: 2rem; line-height: 1; color: var(--sun); grid-row: span 3; }
  .steps .name { font-weight: 700; font-size: 1.15rem; }
  .steps .boat { color: var(--muted); font-size: 1rem; }
  .steps .yours { font-size: .9rem; color: var(--muted); }
  .cycle { width: 100%; max-width: 680px; height: auto; display: block; margin: 1rem auto 1.5rem; }
  .cycle .ring { stroke: var(--navy); fill: none; }
  .cycle .node { fill: var(--navy); }
  .cycle .node.hot { fill: var(--sun); }
  .cycle text { fill: var(--ink); font-family: var(--body); font-size: 15px; }
  .cycle .center { fill: var(--muted); font-family: var(--display); font-weight: 800; font-size: 26px; }
  .cycle .arrowhead { fill: var(--navy); }

  /* Stage 4 */
  .example { background: var(--surface); border-radius: 8px; padding: 1.1rem 1.25rem; margin: 0 0 2rem; border-top: 4px solid var(--navy); }
  .example dl { display: grid; grid-template-columns: 9rem 1fr; gap: .5rem 1rem; margin: 0; }
  .example dt { font-weight: 700; color: var(--muted); }
  .example dd { margin: 0; }
  .roteiro { border-top-color: var(--sun); }
  a.btn { text-decoration: none; }
  .url { word-break: break-all; }
  @media (max-width: 600px) { .example dl { grid-template-columns: 1fr; } .example dd { margin-bottom: .4rem; } }
  .field { margin: 0 0 1.3rem; }
  .field label { display: block; font-weight: 700; margin-bottom: .2rem; }
  .field .hint { display: block; font-size: .95rem; color: var(--muted); margin-bottom: .45rem; }
  .field textarea { width: 100%; min-height: 4.8rem; resize: vertical; background: var(--surface); border: 2px solid var(--line); border-radius: 8px; padding: .7rem .8rem; line-height: 1.45; }
  .field textarea.tall { min-height: 8rem; }
  .field textarea.one { min-height: 3rem; }
  .field textarea:focus { border-color: var(--navy); outline: none; box-shadow: 0 0 0 3px var(--sun); }
  .err { color: var(--bad); font-weight: 700; }
  .family { display: grid; gap: .3rem; margin: 1rem 0 1.4rem; }
  .family div { font-family: var(--display); font-weight: 800; font-size: clamp(1.8rem, 6vw, 3rem); line-height: 1.05; color: var(--muted); }
  .family b { color: var(--sun); }

  /* RAG game */
  .manual { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--navy); border-radius: 0 8px 8px 0; padding: 1.1rem 1.3rem; margin: 0 0 1.5rem; }
  .manual h3 { font-family: var(--display); font-weight: 800; font-size: 1.5rem; margin: 0 0 .6rem; }
  .manual h4 { font-size: 1rem; margin: .8rem 0 .15rem; color: var(--muted); }
  .manual p { margin: 0; }
  .methods { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .75rem; margin: 0 0 1.5rem; }
  @media (max-width: 680px) { .methods { grid-template-columns: 1fr; } }
  .method { text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 8px; padding: .8rem 1rem; cursor: pointer; }
  .method b { display: block; font-size: 1.1rem; }
  .method span { display: block; font-size: .95rem; color: var(--muted); }
  .method:hover { border-color: var(--navy); }
  .method[aria-pressed="true"] { border-color: var(--navy); box-shadow: inset 0 0 0 2px var(--navy); }
  .method .seen { font-size: .85rem; color: var(--ok); font-weight: 700; margin-top: .3rem; }
  .fichas { list-style: none; margin: 0 0 1.5rem; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: .6rem; }
  .ficha { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: .8rem .9rem .8rem 1rem; font-size: 1rem; box-shadow: 0 2px 0 var(--line); }
  .ficha .id { display: block; font-family: var(--display); font-weight: 800; font-size: 1rem; color: var(--muted); margin-bottom: .2rem; letter-spacing: .03em; }
  .cut { color: var(--bad); font-weight: 700; }
  .test { border-top: 1px solid var(--line); padding: 1rem 0; }
  .test .q { font-weight: 700; margin-bottom: .5rem; }
  .test .got { font-size: 1rem; color: var(--muted); margin-bottom: .35rem; }
  .test .ans { margin-bottom: .35rem; }
  .mark { display: inline-block; font-weight: 700; padding: .05rem .5rem; border-radius: 4px; font-size: .9rem; }
  .mark.ok { color: var(--ok); background: var(--ok-soft); }
  .mark.no { color: var(--bad); background: var(--bad-soft); }
  .tablewrap { overflow-x: auto; margin: 0 0 1.5rem; }
  table { border-collapse: collapse; width: 100%; min-width: 480px; font-size: 1rem; }
  th, td { text-align: left; padding: .55rem .6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 700; }
  td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .checks { display: grid; gap: .6rem; margin: 0 0 1rem; }
  .check { display: flex; gap: .8rem; align-items: center; text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 8px; padding: .75rem 1rem; cursor: pointer; font-size: 1.05rem; }
  .check .box { flex: 0 0 auto; width: 1.4rem; height: 1.4rem; border: 2px solid var(--muted); border-radius: 4px; display: grid; place-items: center; font-weight: 700; font-size: .95rem; }
  .check[aria-pressed="true"] { border-color: var(--navy); }
  .check[aria-pressed="true"] .box { background: var(--navy); border-color: var(--navy); color: var(--surface); }
  .check:disabled { cursor: default; }
  .check.right { border-color: var(--ok); background: var(--ok-soft); }
  .check.wrong { border-color: var(--bad); background: var(--bad-soft); }
  .check .tag { margin-left: auto; font-size: .85rem; font-weight: 700; white-space: nowrap; }
  .check.right .tag { color: var(--ok); } .check.wrong .tag { color: var(--bad); }
  .pile { list-style: none; margin: 0 0 1.25rem; padding: 0; display: grid; gap: .5rem; }
  .pcard { width: 100%; display: grid; grid-template-columns: 2.2rem 1fr auto; gap: .8rem; align-items: center; text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 8px; padding: .65rem .9rem; cursor: pointer; font-size: 1rem; }
  .pcard:hover:not(:disabled) { border-color: var(--navy); }
  .pcard:disabled { cursor: default; }
  .pcard .rank { font-family: var(--display); font-weight: 800; font-size: 1.4rem; color: var(--muted); text-align: center; }
  .pcard .sim { font-size: .85rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .pcard.on { border-color: var(--navy); background: var(--bg); }
  .pcard.on .rank { color: var(--navy); }
  .pcard.good { border-color: var(--ok); background: var(--ok-soft); }
  .pcard.miss { border-color: var(--bad); background: var(--bad-soft); }
  .desk ul { margin: 0; padding-left: 1.3rem; }
  .desk { background: var(--surface); border: 2px solid var(--navy); border-radius: 8px; padding: 1rem 1.2rem; margin: 0 0 1.25rem; }
  .desk h3 { margin-bottom: .6rem; }
  .desk ol { margin: 0; padding-left: 1.3rem; }
  .desk li { margin-bottom: .35rem; }
  .meter { margin: 1rem 0 1.5rem; }
  .meter label { display: block; font-weight: 700; margin-bottom: .4rem; }
  .meter input[type="range"] { width: 100%; max-width: 520px; accent-color: var(--navy); }
  .meterbar { height: 18px; background: var(--bg); border: 1px solid var(--line); border-radius: 9px; overflow: hidden; max-width: 520px; margin: .6rem 0 .4rem; }
  .meterbar div { height: 100%; background: var(--sun); transition: width .25s; }
  @media (prefers-reduced-motion: reduce) { .meterbar div { transition: none; } }
  .gold { background: var(--surface); border-radius: 8px; border-top: 4px solid var(--sun); padding: 1rem 1.2rem; margin: 0 0 1.5rem; }
  .gold dl { display: grid; grid-template-columns: 11rem 1fr; gap: .45rem 1rem; margin: 0; }
  .gold dt { font-weight: 700; color: var(--muted); }
  .gold dd { margin: 0; }
  @media (max-width: 600px) { .gold dl { grid-template-columns: 1fr; } }
  .answer { border-top: 1px solid var(--line); padding: 1.1rem 0; }
  .answer blockquote { margin: 0 0 .8rem; padding: .6rem .9rem; background: var(--surface); border-radius: 6px; font-size: 1.05rem; }
  .yn { display: flex; flex-wrap: wrap; gap: .5rem 1.5rem; align-items: center; }
  .yn .grp { display: flex; gap: .4rem; align-items: center; }
  .yn .lbl { font-weight: 700; margin-right: .3rem; }
  .pill { border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: .3rem .9rem; cursor: pointer; font-size: 1rem; }
  .pill[aria-pressed="true"] { border-color: var(--navy); background: var(--navy); color: var(--surface); }
  .pill.right { border-color: var(--ok); background: var(--ok-soft); color: var(--ink); }
  .pill.wrong { border-color: var(--bad); background: var(--bad-soft); color: var(--ink); }
  .pill:disabled { cursor: default; }
  .judge { list-style: none; padding: 0; margin: 0 0 1.25rem; display: grid; gap: .5rem; }
  .judge li { display: grid; grid-template-columns: 3rem 3.6rem 1fr; gap: .8rem; align-items: baseline; background: var(--surface); border-radius: 6px; padding: .6rem .9rem; }
  .judge .r { font-weight: 700; }
  .judge .n { font-family: var(--display); font-weight: 800; font-size: 1.6rem; color: var(--navy); }
  .defs { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; margin: 1rem 0; }
  .defs div { border-top: 3px solid var(--sun); padding-top: .6rem; }
  .defs h3 { font-size: 1.05rem; }
  .defs p { font-size: 1rem; margin: 0; }
  .scen { border-top: 1px solid var(--line); padding: 1.1rem 0; }
  .scen p.s { font-weight: 700; font-size: 1.15rem; margin-bottom: .7rem; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
  @media (max-width: 560px) { .two { grid-template-columns: 1fr; } }
</style>
</head>

<div class="bar">
  <div class="brand">Da pilha à mesa</div>
</div>
<nav class="stages" id="stages" aria-label="Etapas"></nav>
<main id="app" aria-live="polite"></main>
<script>
(function () {
  "use strict";

  // =================== Content ===================
  var CHAPTER_URL = "https://brasileiraspln.ufscar.br/livro-pln-4ed-vol2/modelos/cap-rag/cap-rag.pdf";
  var STAGES = [
    { id: "0", t: "Abertura" },
    { id: "1", t: "A tesoura do bibliotecário" },
    { id: "2", t: "Da pilha à mesa" },
    { id: "3", t: "O caderno de gabarito" },
    { id: "4", t: "Curso ou páginas?" },
    { id: "5", t: "O caderno da turma" }
  ];
  var MURAL_URL = "https://padlet.com/pedroaurelioabreu/a-familia-lima-machado-a-tripulacao-da-larissa-s024dp5qsj5oiao6viu3";

        (s.open ? '<div class="feedback">' + verdict(s.open === "B") + "<p>O \u201clivro fechado\u201d é a memória do capitão, o que ele leu antes de partir. O \u201clivro aberto\u201d são as páginas consultadas na hora. O RAG é o trabalho de escolher e levar essas páginas até a mesa.</p></div>" : "") + "</section>";
    }

    app.innerHTML = head + scenes + solution + reading + actions();
    var sf = document.getElementById("showFlags"); if (sf) sf.addEventListener("click", function () { s.shown = true; keep(); });
    on("[data-sc]", function (b) { s.sc[b.getAttribute("data-sc")] = b.getAttribute("data-k"); keep(); });
    var so = document.getElementById("solve"); if (so) so.addEventListener("click", function () { s.solved = true; keep(); });
    on("[data-open]", function (b) { s.open = b.getAttribute("data-open"); keep(); });
    wireShell();
  }

  // =================== Stage 1: chunking ===================
  function chunkHtml(text, idx) {
    var startCut = !/^[A-ZÁÉÍÓÚÂÊÔÃÕÇ]/.test(text);
    var endCut = !/[.!?]$/.test(text);
    return '<li class="ficha"><span class="id">Ficha ' + (idx + 1) + "</span>" +
      (startCut ? '<span class="cut" title="Cortada no meio">\u2702 </span>' : "") + text +
      (endCut ? '<span class="cut" title="Cortada no meio"> \u2702</span>' : "") + "</li>";
  }
  function render1() {
    var s = st.s1;
    var manual = '<div class="manual"><h3>Manual de tempestades da Companhia Atlântica</h3>' +
      MANUAL.map(function (x) { return "<h4>" + x.h + "</h4><p>" + x.p + "</p>"; }).join("") + "</div>";
    var methods = METHOD_KEYS.map(function (k) {
      var m = METHODS[k];
      return '<button type="button" class="method" data-m="' + k + '" aria-pressed="' + (s.method === k) + '"><b>' + m.name + "</b><span>" + m.how + "</span>" + (s.tried[k] ? '<span class="seen">Testado</span>' : "") + "</button>";
    }).join("");
    var result = "";
    if (s.method) {
      var m = METHODS[s.method];
      result = '<h3 style="font-size:1.3rem">Fichas do corte \u201c' + m.name + '\u201d</h3><ol class="fichas">' + m.chunks.map(chunkHtml).join("") + "</ol>" +
        '<h3 style="font-size:1.3rem">Teste com duas perguntas do capitão</h3>' +
        m.tests.map(function (t, i) {
          return '<div class="test"><div class="q">' + TESTS_Q[i] + '</div><div class="got">O bibliotecário levou à mesa a ficha ' + (t.got + 1) + ": \u201c" + m.chunks[t.got] + "\u201d</div>" +
            '<div class="ans">Capitão: \u201c' + t.ans + '\u201d <span class="mark ' + (t.ok ? "ok" : "no") + '">' + (t.ok ? "Resposta completa" : "Resposta errada ou incompleta") + "</span></div>" +
            '<div class="muted" style="font-size:1rem">' + t.why + "</div></div>";
        }).join("");
    }
    var tried = METHOD_KEYS.filter(function (k) { return s.tried[k]; });
    var table = "";
    if (tried.length) {
      table = '<h3 style="font-size:1.3rem;margin-top:1.5rem">Comparando os cortes</h3><div class="tablewrap"><table><thead><tr><th>Corte</th><th>Fichas</th><th>Respostas certas</th></tr></thead><tbody>' +
        tried.map(function (k) {
          var m = METHODS[k], ok = m.tests.filter(function (t) { return t.ok; }).length;
          return "<tr><td>" + m.name + '</td><td class="num">' + m.chunks.length + '</td><td class="num">' + ok + " de " + m.tests.length + "</td></tr>";
        }).join("") + "</tbody></table></div>";
    }
    var quiz = "";
    if (tried.length === METHOD_KEYS.length) {
      var items = CHUNK_QUIZ.map(function (q) {
        var picked = s.quiz.indexOf(q.k) !== -1, cls = "check", tag = "";
        if (s.quizDone) { if (q.ok) { cls += " right"; tag = '<span class="tag">Critério válido</span>'; } else if (picked) { cls += " wrong"; tag = '<span class="tag">Não é critério</span>'; } }
        return '<button type="button" class="' + cls + '" data-q="' + q.k + '" aria-pressed="' + picked + '"' + (s.quizDone ? " disabled" : "") + '><span class="box">' + (picked ? "\u2713" : "") + "</span><span>" + q.t + "</span>" + tag + "</button>";
      }).join("");
      var good = CHUNK_QUIZ.filter(function (q) { return q.ok; }).map(function (q) { return q.k; });
      quiz = '<section class="boxed" style="margin-top:2rem"><h2>Como saber se uma ficha é boa?</h2><p>Marque todos os critérios que ajudam a avaliar um chunk.</p><div class="checks">' + items + "</div>" +
        (s.quizDone
          ? '<div class="feedback">' + verdict(same(s.quiz, good), "Isso mesmo.", "Quase.") +
            "<p>Uma boa ficha faz sentido sozinha, trata de um assunto só e, quando é recuperada, responde às perguntas do caderno de gabarito. O tamanho é um equilíbrio: fichas pequenas demais perdem o contexto; grandes demais misturam assuntos, atrapalham a busca e custam mais tokens. Uma técnica comum para não cortar ideias no meio é a <b>sobreposição</b>: cada ficha repete o final da anterior.</p></div>"
          : '<div class="actions"><button class="btn" type="button" id="checkQuiz"' + (s.quiz.length ? "" : " disabled") + ">Conferir</button></div>") +
        "</section>";
    } else {
      quiz = '<p class="note">Teste os três cortes para liberar a pergunta final desta etapa.</p>';
    }
    app.innerHTML = '<p class="step">Jogo 1</p><h2>A tesoura do bibliotecário</h2>' +
      '<p class="lead">No último porto, chegou o manual de tempestades da companhia. Para encontrar as coisas depois, o bibliotecário precisa recortá-lo em fichas: os <b>chunks</b>.</p>' +
      manual + "<p>Escolha uma forma de cortar e veja o que acontece quando o capitão faz perguntas.</p>" +
      '<div class="methods">' + methods + "</div>" + result + table + quiz + actions();
    on("[data-m]", function (b) { var k = b.getAttribute("data-m"); s.method = k; s.tried[k] = true; keep(); });
    on("[data-q]", function (b) { var k = b.getAttribute("data-q"), i = s.quiz.indexOf(k); if (i === -1) s.quiz.push(k); else s.quiz.splice(i, 1); keep(); });
    var cq = document.getElementById("checkQuiz");
    if (cq) cq.addEventListener("click", function () { s.quizDone = true; keep(); });
    wireShell();
  }

  // =================== Stage 2: retrieval, reranking, cost ===================
  function render2() {
    var s = st.s2;
    var pile = PILE.map(function (c) {
      var inDesk = s.desk.indexOf(c.id) !== -1, cls = "pcard" + (inDesk ? " on" : "");
      if (s.done) cls += RELEVANT2.indexOf(c.id) !== -1 ? " good" : (inDesk ? " miss" : "");
      return '<li><button type="button" class="' + cls + '" data-c="' + c.id + '"' + (s.done ? " disabled" : "") + ' aria-pressed="' + inDesk + '">' +
        '<span class="rank">' + (inDesk ? "\u2713" : c.id) + "</span><span>" + c.t + '</span><span class="sim">' + c.sim + "% parecida</span></button></li>";
    }).join("");
    var deskHtml = '<div class="desk"><h3>Na mesa do capitão (' + s.desk.length + " de 3)</h3>" +
      (s.desk.length ? "<ul>" + s.desk.map(function (id) { return "<li>Ficha " + id + ": " + pileById(id).t + "</li>"; }).join("") + "</ul>" : '<p class="muted" style="margin:0">Clique nas fichas da pilha que podem ajudar.</p>') + "</div>";
    var res = "";
    if (s.done) {
      var mine = captainAnswer(s.desk), top3 = captainAnswer(["1", "2", "3"]), all = captainAnswer(PILE.map(function (c) { return c.id; }));
      var right = same(s.desk, RELEVANT2);
      res = '<div class="feedback">' + verdict(mine.ok, "O capitão acertou.", "O capitão errou.") + "<p>Capitão: \u201c" + mine.t + "\u201d</p>" + (mine.why ? "<p>" + mine.why + "</p>" : "") +
        (right ? "" : "<p>As fichas que ajudavam eram a 2, a 5 e a 7, marcadas em verde na pilha.</p>") + "</div>" +
        '<h3 style="font-size:1.3rem;margin-top:1.75rem">Três jeitos de escolher as fichas</h3>' +
        '<div class="tablewrap"><table><thead><tr><th>Estratégia</th><th>Fichas</th><th>Tokens de entrada</th><th>Resposta</th></tr></thead><tbody>' +
        '<tr><td>Só a busca rápida: as 3 mais parecidas</td><td>1, 2, 3</td><td class="num">\u2248 ' + deskTokens(["1", "2", "3"]) + "</td><td>" + (top3.ok ? "Certa" : "Errada") + "</td></tr>" +
        '<tr><td>Só a busca rápida: todas as 8</td><td>1 a 8</td><td class="num">\u2248 ' + deskTokens(PILE.map(function (c) { return c.id; })) + "</td><td>" + (all.ok ? "Certa, mas com muito ruído" : "Errada") + "</td></tr>" +
        "<tr><td><b>Busca rápida + sua seleção</b></td><td>" + s.desk.join(", ") + '</td><td class="num">\u2248 ' + deskTokens(s.desk) + "</td><td>" + (mine.ok ? "Certa" : "Errada ou incompleta") + "</td></tr>" +
        "</tbody></table></div>" +
        "<p>Repare que o festival, as tempestades de março a maio, a feira de barcos e o abrigo de animais apareceram no alto da pilha só porque compartilham palavras com a pergunta, como \u201cporto\u201d, \u201ctempestade\u201d e \u201cabrigo\u201d, ou falam de assuntos vizinhos, como barcos. A busca rápida mede o quanto uma ficha é <i>parecida</i> com a pergunta, não o quanto ela é <i>útil</i>.</p>" +
        "<p>Você fez à mão o trabalho de um <b>reranker</b>. Ele lê cada ficha junto com a pergunta, combina a semelhança da busca rápida com uma avaliação de relevância e, com isso, <b>reordena</b> a pilha: as fichas úteis sobem para o topo, e as três primeiras vão para a mesa. A ficha de Ilha Clara, que estava em 7º lugar, subiria para as primeiras posições.</p>" +
        "<p>Outras formas de melhorar a busca: combinar a busca por significado com a busca por palavras-chave (<b>busca híbrida</b>) e reescrever a pergunta antes de buscar.</p>" +
        meter();
    }
    app.innerHTML = '<p class="step">Jogo 2</p><h2>Da pilha à mesa</h2>' +
      '<p class="lead">O capitão pergunta: \u201c' + QUESTION2 + "\u201d</p>" +
      "<p>Um ajudante faz uma busca rápida no porão e traz as oito fichas mais parecidas com a pergunta, em ordem de semelhança. Cabem só três na mesa. Leia a pilha de cima para baixo e puxe as <b>três primeiras fichas que podem ajudar</b> o capitão a responder.</p>" +
      '<ul class="pile">' + pile + "</ul>" + deskHtml +
      (s.done ? res : '<div class="actions"><button class="btn" type="button" id="toDesk"' + (s.desk.length === 3 ? "" : " disabled") + ">Levar à mesa</button>" + (s.desk.length < 3 ? '<span class="muted">Escolha três fichas.</span>' : "") + "</div>") +
      actions();
    on("[data-c]", function (b) {
      var id = b.getAttribute("data-c"), i = s.desk.indexOf(id);
      if (i !== -1) s.desk.splice(i, 1); else if (s.desk.length < 3) s.desk.push(id);
      s.desk.sort(function (x, y) { return pileIndex(x) - pileIndex(y); });
      keep();
      var again = app.querySelector('[data-c="' + id + '"]'); if (again) again.focus({ preventScroll: true });
    });
    var td = document.getElementById("toDesk");
    if (td) td.addEventListener("click", function () { s.done = true; keep(); });
    var rg = document.getElementById("k");
    if (rg) rg.addEventListener("input", function () { s.k = parseInt(rg.value, 10); updateMeter(); persist(); });
    wireShell();
  }
  function meterIds(k) { return PILE.slice(0, k).map(function (c) { return c.id; }); }
  function meter() {
    return '<section class="boxed" style="margin-top:2rem"><h2>O medidor de custo</h2>' +
      "<p>O capitão cobra por palavra lida e escrita. Nos modelos de linguagem, essa unidade é o <b>token</b>, um pedaço de palavra. Você paga pelos tokens de <b>entrada</b> (a pergunta mais as fichas na mesa) e pelos de <b>saída</b> (a resposta), e o token de saída costuma ser mais caro.</p>" +
      '<div class="meter"><label for="k">Fichas na mesa, na ordem da busca rápida: <span id="kv"></span></label><input id="k" type="range" min="1" max="8" step="1" value="' + st.s2.k + '">' +
      '<div class="meterbar" aria-hidden="true"><div id="kb"></div></div><p id="kt" class="muted" style="margin:0"></p></div>' +
      "<p>Cada ficha a mais aumenta o custo e o tempo de resposta, e pode distrair o capitão com informação irrelevante. Por isso o reranking compensa: poucas fichas, as certas.</p></section>";
  }
  function updateMeter() {
    var k = st.s2.k, tk = deskTokens(meterIds(k)), max = deskTokens(meterIds(8));
    var kv = document.getElementById("kv"), kb = document.getElementById("kb"), kt = document.getElementById("kt");
    if (!kv) return;
    kv.textContent = k;
    kb.style.width = Math.round(tk * 100 / max) + "%";
    kt.textContent = "\u2248 " + tk + " tokens de entrada por pergunta. Em 10.000 perguntas por dia, isso dá cerca de " + fmt(tk * 10000) + " tokens.";
  }

  // =================== Stage 3: evaluation ===================

      "<dt>Resposta de referência</dt><dd>Ilha Clara, a 40 milhas ao norte.</dd></dl></div>";

      '<div class="answer"><p><b>Recall:</b> das fichas relevantes do gabarito, quantas chegaram à mesa?</p><div class="yn"><div class="grp">' + choice("rec", s.rec, ["1 de 3", "2 de 3", "3 de 3"], "2 de 3", s.pr) + "</div></div></div>" +
      (s.pr
        ? '<div class="feedback">' + verdict(s.prec === "2 de 4" && s.rec === "2 de 3", "Isso mesmo.", "Confira as contas.") +

        : '<div class="actions"><button class="btn" type="button" id="checkPR"' + (s.prec && s.rec ? "" : " disabled") + ">Conferir</button></div>") + "</section>";

    var cls = "";
    if (s.pr) {
      var allSet = ANSWERS.every(function (a) { return s.cls[a.id] && s.cls[a.id].fiel && s.cls[a.id].cor; });
      cls = '<section class="pollq"><h3>Agora avalie o capitão</h3><p>Com aquelas quatro fichas na mesa, o capitão deu três respostas diferentes em três tentativas. Para cada uma, diga se ela é <b>fiel</b> às fichas (tudo o que ele disse está nelas) e se está <b>correta</b> segundo o gabarito.</p>' +
        ANSWERS.map(function (a) {

        return '<button type="button" class="' + c + '" data-j="' + k + '"' + (s.judge ? " disabled" : "") + "><span>" + JUDGE_Q.opts[k] + "</span>" + tag + "</button>";
      }).join("");
      judge = '<section class="boxed" style="margin-top:2rem"><h2>O capitão avaliador</h2>' +
        "<p>Corrigir milhares de respostas à mão é impossível, então a companhia pediu a outro capitão que desse notas de 0 a 10. Esse é o <b>LLM as a judge</b>: um modelo avaliando as respostas de outro.</p>" +
        '<ul class="judge">' + JUDGE.map(function (j) { return '<li><span class="r">' + j.r + '</span><span class="n">' + j.n + "</span><span>" + j.c + "</span></li>"; }).join("") + "</ul>" +
        "<h3>" + JUDGE_Q.q + '</h3><div class="options">' + jo + "</div>" +

    app.innerHTML = '<p class="step">Jogo 3</p><h2>O caderno de gabarito</h2>' +

      gold + desk + pr + cls + judge + actions();
    on("[data-prec]", function (b) { s.prec = b.getAttribute("data-prec"); keep(); });
    on("[data-rec]", function (b) { s.rec = b.getAttribute("data-rec"); keep(); });
    var cp = document.getElementById("checkPR"); if (cp) cp.addEventListener("click", function () { s.pr = true; keep(); });
    on("[data-a]", function (b) { var a = b.getAttribute("data-a"); s.cls[a] = s.cls[a] || {}; s.cls[a][b.getAttribute("data-f")] = b.getAttribute("data-v"); keep(); });

  }

  // =================== Stage 4: RAG or fine-tuning ===================
  function render4() {
    var s = st.s4;
    var items = SCEN.map(function (sc) {
      var v = s[sc.id];
      var btns = ["rag", "ft"].map(function (k) {
        var c = "opt", tag = "";
        if (v) { if (k === v) { c += k === sc.a ? " right" : " wrong"; tag = '<span class="tag">' + (k === sc.a ? "Certa" : "Errada") + "</span>"; } else c += " faded"; }
        return '<button type="button" class="' + c + '" data-s="' + sc.id + '" data-k="' + k + '"' + (v ? " disabled" : "") + "><span>" + SCEN_LABEL[k] + "</span>" + tag + "</button>";
      }).join("");
      return '<div class="scen"><p class="s">' + sc.t + '</p><div class="two">' + btns + "</div>" + (v ? '<p style="margin:.7rem 0 0">' + sc.why + "</p>" : "") + "</div>";
    }).join("");
    var all = SCEN.every(function (sc) { return s[sc.id]; });
    app.innerHTML = '<p class="step">Jogo 4</p><h2>Curso ou páginas?</h2>' +
      '<p class="lead">Há dois jeitos de preparar o capitão para um trabalho novo. Mandá-lo fazer um <b>curso</b> (fine-tuning) muda o jeito como ele trabalha. Trazer <b>páginas</b> à mesa (RAG) muda o que ele sabe naquele momento.</p>' +
      "<p>Para cada situação, qual é o melhor caminho?</p>" + items +
      (all ? '<section class="boxed" style="margin-top:2rem"><h2>Regra de bolso</h2><p>Se o problema é <b>o que</b> o capitão sabe (informação nova, que muda ou precisa de fonte), traga páginas. Se o problema é <b>como</b> ele trabalha (formato, estilo, vocabulário), considere um curso. E muitas vezes o melhor navio usa os dois.</p></section>' : "") +
      actions();
    on("[data-s]", function (b) { s[b.getAttribute("data-s")] = b.getAttribute("data-k"); keep(); });
    wireShell();
  }

  // =================== Stage 5: creation ===================
  function render5() {
    var s = st.s5 || (st.s5 = { posted: false });
    var mural = MURAL_URL
      ? '<a class="btn" href="' + MURAL_URL + '" target="_blank" rel="noopener">Abrir o mural da turma</a>'
      : "";
    app.innerHTML = '<p class="step">Criação</p><h2>O caderno da turma</h2>' +
      '<p class="lead">A companhia quer levar o bibliotecário de bordo para outros lugares. Agora é você quem monta o RAG de uma nova área.</p>' +
      "<p>Escolha uma área que você conheça bem, como um hospital, uma loja ou a sua faculdade. Publique no mural da turma um cartão com o nome da área como título e estes três itens:</p>" +
      '<div class="example roteiro"><dl>' +
      "<dt>A estante</dt><dd>De onde viriam as páginas? Manuais, regulamentos, histórico de pedidos…</dd>" +
      "<dt>Uma pergunta do gabarito</dt><dd>Uma pergunta real, a ficha que responde a ela e a resposta de referência.</dd>" +
      "<dt>Uma ficha armadilha</dt><dd>Uma ficha que pareceria muito com a pergunta, mas não ajudaria em nada.</dd>" +
      "</dl></div>" +
      '<div class="example"><h3>Exemplo: uma academia de ginástica</h3><dl>' +
      "<dt>A estante</dt><dd>Regulamento interno, tabela de horários, planos e preços.</dd>" +
      "<dt>Pergunta</dt><dd>\u201cPosso congelar meu plano durante as férias?\u201d</dd>" +
      "<dt>Ficha que responde</dt><dd>\u201cPlanos anuais podem ser congelados por até 30 dias por ano.\u201d</dd>" +
      "<dt>Resposta de referência</dt><dd>Sim, se o plano for anual, por até 30 dias.</dd>" +
      "<dt>Ficha armadilha</dt><dd>\u201cColônia de férias para crianças: inscrições abertas em julho, com planos especiais.\u201d</dd>" +
      "</dl></div>" +
      "<p>Depois de publicar, escolha o cartão de um colega no mural e comente: <b>a armadilha dele enganaria o bibliotecário? Por quê?</b></p>" +
      '<div class="actions">' + mural + '<button class="btn ghost" type="button" id="posted">Já publiquei no mural</button>' +
      '<button class="btn ghost" type="button" data-restart="1">Recomeçar esta etapa</button></div>' +
      (MURAL_URL ? '<p class="note">Se o botão não abrir o mural, copie este endereço no navegador: <span class="url">' + MURAL_URL + "</span></p>" : '<p class="note">O professor vai passar o link do mural da turma.</p>') +
      (s.posted ? '<p class="note" role="status">Pronto. Agora acompanhe o mural com a turma.</p>' : "");
    document.getElementById("posted").addEventListener("click", function () { s.posted = true; keep(); });
    wireShell();
  }


  // =================== Routing ===================
  function render() {
    renderStages();
    [render0, render1, render2, render3, render4, render5][st.si]();
    if (st.si === 2) updateMeter();
  }
  render();
})();
</script>

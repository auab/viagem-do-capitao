<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A viagem do capitão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #E4ECF0; --surface: #F6F9FA; --ink: #10304A; --muted: #4C6577; --line: #B5C7D2;
    --navy: #1B4F77; --sun: #E3A50B; --ok: #1E7656; --ok-soft: #DCEFE6; --bad: #AF3329; --bad-soft: #F6E1DE;
    --focus: #E3A50B;
    --display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
    --body: "Atkinson Hyperlegible", "Segoe UI", Verdana, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0C1C29; --surface: #132838; --ink: #E3ECF1; --muted: #9BB1C0; --line: #2B4558;
      --navy: #79AEDB; --sun: #F0B83A; --ok: #5CC59A; --ok-soft: #173B30; --bad: #E87467; --bad-soft: #43231F;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0C1C29; --surface: #132838; --ink: #E3ECF1; --muted: #9BB1C0; --line: #2B4558;
    --navy: #79AEDB; --sun: #F0B83A; --ok: #5CC59A; --ok-soft: #173B30; --bad: #E87467; --bad-soft: #43231F;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 1.125rem; line-height: 1.55; }
  img, svg { max-width: 100%; }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  a { color: var(--navy); }

  .bar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; max-width: 880px; margin: 0 auto; padding: 1.1rem 1.25rem 0; flex-wrap: wrap; }
  .brand { font-family: var(--display); font-weight: 800; font-size: 1.35rem; letter-spacing: .02em; color: var(--navy); }
  .tabs { display: none; gap: .25rem; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: .2rem; }
  .tabs.on { display: flex; }
  .tabs button { border: 0; background: transparent; padding: .4rem .9rem; border-radius: 999px; cursor: pointer; font-size: .95rem; }
  .tabs button[aria-pressed="true"] { background: var(--navy); color: var(--surface); }

  .stages { max-width: 880px; margin: 0 auto; padding: .9rem 1.25rem 0; }
  .stages ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: .4rem; }
  .stages button { width: 100%; text-align: left; background: transparent; border: 0; border-top: 4px solid var(--line); padding: .45rem .2rem 0; cursor: pointer; color: var(--muted); font-size: .92rem; line-height: 1.3; }
  .stages button .n { display: block; font-family: var(--display); font-weight: 800; font-size: 1.15rem; color: inherit; }
  .stages button.done { border-top-color: var(--navy); }
  .stages button[aria-current="step"] { border-top-color: var(--sun); color: var(--ink); font-weight: 700; }
  @media (max-width: 560px) { .stages .t { display: none; } }

  main { max-width: 880px; margin: 0 auto; padding: 1.25rem 1.25rem 4rem; }
  h1 { font-family: var(--display); font-weight: 800; font-size: clamp(3rem, 9vw, 5.6rem); line-height: .92; letter-spacing: .005em; margin: 1.5rem 0 1.25rem; }
  h2 { font-family: var(--display); font-weight: 700; font-size: clamp(2rem, 5vw, 3rem); line-height: 1.02; margin: .4rem 0 1.25rem; }
  h3 { font-size: 1.15rem; margin: 0 0 .35rem; }
  p { margin: 0 0 1rem; max-width: 64ch; }
  .lead { font-size: 1.25rem; }
  .muted { color: var(--muted); }

  .route { width: 100%; height: auto; display: block; margin: .5rem 0 1rem; }
  .route .wave { stroke: var(--line); } .route .path { stroke: var(--navy); }
  .route .stop { fill: var(--surface); stroke: var(--navy); } .route .stop.done { fill: var(--navy); }
  .route .port { fill: var(--sun); } .route .hull { fill: var(--ink); } .route .sail { fill: var(--surface); stroke: var(--ink); }
  .route text { fill: var(--muted); font-family: var(--body); font-size: 13px; }
  .ship { transition: transform .6s cubic-bezier(.4,.1,.2,1); }
  @media (prefers-reduced-motion: reduce) { .ship { transition: none; } }

  .btn { display: inline-flex; align-items: center; gap: .5rem; background: var(--navy); color: var(--surface); border: 0; border-radius: 6px; padding: .8rem 1.4rem; font-weight: 700; font-size: 1.1rem; cursor: pointer; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--navy); border: 2px solid var(--navy); }
  .btn.danger { background: transparent; color: var(--bad); border: 2px solid var(--bad); }
  .actions { margin-top: 1.5rem; display: flex; gap: .75rem; flex-wrap: wrap; align-items: center; }

  .legend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .6rem 1.5rem; margin: 1.5rem 0 2rem; padding: 0; list-style: none; }
  .legend li { display: flex; gap: .75rem; align-items: center; }
  @media (max-width: 560px) { .legend { grid-template-columns: 1fr; } }
  .flag { flex: 0 0 auto; width: 44px; height: 32px; border-radius: 2px; box-shadow: 0 0 0 1px rgba(0,0,0,.18); }

  .step { color: var(--muted); font-size: 1rem; margin: 0; }
  .ask { color: var(--muted); margin: -.6rem 0 1.1rem; }
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
  @media (max-width: 640px) { .options { grid-template-columns: 1fr; } }
  .opt { display: flex; align-items: center; gap: .9rem; text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 8px; padding: .85rem 1rem; cursor: pointer; min-height: 4.2rem; font-size: 1.05rem; }
  .opt:hover:not(:disabled) { border-color: var(--navy); }
  .opt:disabled { cursor: default; }
  .opt.picked { border-color: var(--navy); box-shadow: inset 0 0 0 2px var(--navy); }
  .opt.right { border-color: var(--ok); background: var(--ok-soft); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
  .opt.faded { opacity: .55; }
  .opt .tag { margin-left: auto; font-size: .85rem; font-weight: 700; white-space: nowrap; }
  .opt.right .tag { color: var(--ok); } .opt.wrong .tag { color: var(--bad); }
  .feedback { margin-top: 1.5rem; border-left: 5px solid var(--sun); background: var(--surface); padding: 1.1rem 1.25rem; border-radius: 0 8px 8px 0; }
  .feedback p:last-child { margin-bottom: 0; }
  .verdict { font-weight: 700; font-size: 1.2rem; margin-bottom: .6rem; }
  .verdict.ok { color: var(--ok); } .verdict.no { color: var(--bad); }

  .score { font-family: var(--display); font-weight: 800; font-size: clamp(2.4rem, 7vw, 4rem); line-height: 1; margin: 1rem 0 2.5rem; }
  .lessons { list-style: none; padding: 0; margin: 0 0 2rem; display: grid; gap: 1rem; }
  .lessons li { display: flex; gap: 1rem; align-items: flex-start; }
  .lessons p { margin: 0; }
  .boxed { background: var(--surface); border: 2px solid var(--navy); border-radius: 8px; padding: 1.25rem 1.4rem; }
  .boxed h2 { margin-top: 0; }
  .crew { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin: 1rem 0; }
  .crew div { border-top: 3px solid var(--sun); padding-top: .6rem; }
  .note { font-size: .95rem; color: var(--muted); margin-top: 1.75rem; }

  /* Stage 2 */
  .reading { border-left: 5px solid var(--navy); padding: .2rem 0 .2rem 1rem; margin: 0 0 2rem; }
  .pollq { margin: 0 0 2rem; }
  .pollq h3 { font-size: 1.3rem; margin-bottom: .8rem; }
  .reveal-name { font-family: var(--display); font-weight: 800; font-size: clamp(2.4rem, 8vw, 4.6rem); line-height: 1; margin: .6rem 0 1rem; color: var(--muted); }
  .reveal-name b { color: var(--sun); font-weight: 800; }
  .acronym { font-family: var(--display); font-weight: 800; font-size: clamp(3rem, 10vw, 6rem); line-height: 1; letter-spacing: .12em; color: var(--ink); margin: 0 0 1rem; }

  /* Stage 3 */
  .seq { list-style: none; margin: 0 0 1.5rem; padding: 0; display: grid; gap: .6rem; counter-reset: s; }
  .slot { display: flex; align-items: center; gap: .8rem; min-height: 3.6rem; border: 2px dashed var(--line); border-radius: 8px; padding: .5rem .8rem; color: var(--muted); }
  .slot .pos { font-family: var(--display); font-weight: 800; font-size: 1.6rem; width: 1.6rem; text-align: center; color: var(--muted); flex: 0 0 auto; }
  .slot.filled { border-style: solid; background: var(--surface); color: var(--ink); }
  .slot.good { border-color: var(--ok); background: var(--ok-soft); }
  .slot.badpos { border-color: var(--bad); }
  .slot .txt { flex: 1; }
  .mini { display: inline-flex; gap: .25rem; flex: 0 0 auto; }
  .mini button { width: 2.3rem; height: 2.3rem; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; cursor: pointer; font-size: 1rem; line-height: 1; }
  .mini button:disabled { opacity: .35; cursor: default; }
  .pool { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: .6rem; margin: 0 0 1rem; padding: 0; list-style: none; }
  .card { width: 100%; text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 8px; padding: .8rem 1rem; cursor: pointer; font-size: 1.02rem; box-shadow: 0 2px 0 var(--line); }
  .card:hover { border-color: var(--navy); }
  .card:disabled { cursor: default; opacity: .6; }
  .card:disabled:hover { border-color: var(--line); }
  .yours { font-size: .9rem; color: var(--muted); }
  .label-sm { font-size: .95rem; color: var(--muted); margin: 0 0 .5rem; }
  .steps { list-style: none; margin: 0 0 2rem; padding: 0; display: grid; gap: 1rem; }
  .steps li { display: grid; grid-template-columns: 2.4rem 1fr; gap: .2rem .9rem; border-top: 1px solid var(--line); padding-top: 1rem; }
  .steps .num { font-family: var(--display); font-weight: 800; font-size: 2rem; line-height: 1; color: var(--sun); grid-row: span 3; }
  .steps .name { font-weight: 700; font-size: 1.15rem; }
  .steps .boat { color: var(--muted); font-size: 1rem; }
  .steps .yours { font-size: .9rem; color: var(--muted); }
  .cycle { width: 100%; max-width: 680px; height: auto; display: block; margin: 1rem auto 1.5rem; }
  .cycle .ring { stroke: var(--navy); fill: none; }
  .cycle .node { fill: var(--navy); }
  .cycle .node.hot { fill: var(--sun); }
  .cycle text { fill: var(--ink); font-family: var(--body); font-size: 15px; }
  .cycle .center { fill: var(--muted); font-family: var(--display); font-weight: 800; font-size: 26px; }
  .cycle .arrowhead { fill: var(--navy); }

  /* Stage 4 */
  .example { background: var(--surface); border-radius: 8px; padding: 1.1rem 1.25rem; margin: 0 0 2rem; border-top: 4px solid var(--navy); }
  .example dl { display: grid; grid-template-columns: 9rem 1fr; gap: .5rem 1rem; margin: 0; }
  .example dt { font-weight: 700; color: var(--muted); }
  .example dd { margin: 0; }
  .roteiro { border-top-color: var(--sun); }
  a.btn { text-decoration: none; }
  .url { word-break: break-all; }
  @media (max-width: 600px) { .example dl { grid-template-columns: 1fr; } .example dd { margin-bottom: .4rem; } }
  .field { margin: 0 0 1.3rem; }
  .field label { display: block; font-weight: 700; margin-bottom: .2rem; }
  .field .hint { display: block; font-size: .95rem; color: var(--muted); margin-bottom: .45rem; }
  .field textarea { width: 100%; min-height: 4.8rem; resize: vertical; background: var(--surface); border: 2px solid var(--line); border-radius: 8px; padding: .7rem .8rem; line-height: 1.45; }
  .field textarea.tall { min-height: 8rem; }
  .field textarea.one { min-height: 3rem; }
  .field textarea:focus { border-color: var(--navy); outline: none; box-shadow: 0 0 0 3px var(--sun); }
  .err { color: var(--bad); font-weight: 700; }
  .family { display: grid; gap: .3rem; margin: 1rem 0 1.4rem; }
  .family div { font-family: var(--display); font-weight: 800; font-size: clamp(1.8rem, 6vw, 3rem); line-height: 1.05; color: var(--muted); }
  .family b { color: var(--sun); }

  /* Panel */
  .panelnav { display: flex; gap: .5rem; flex-wrap: wrap; margin: 0 0 1.5rem; }
  .panelnav a { padding: .35rem .8rem; border: 1px solid var(--line); border-radius: 999px; text-decoration: none; background: var(--surface); font-size: .95rem; }
  .psec { border-top: 3px solid var(--navy); margin-top: 2.5rem; padding-top: 1rem; }
  .summary { font-size: 1.2rem; }
  .qblock { border-top: 1px solid var(--line); padding: 1.2rem 0; }
  .qblock h3 { font-size: 1.1rem; }
  .bars { display: grid; gap: .45rem; margin-top: .6rem; }
  .barrow { display: grid; grid-template-columns: minmax(10rem, 20rem) 1fr 4.6rem; gap: .7rem; align-items: center; font-size: .95rem; }
  .barrow.withflag { grid-template-columns: 34px minmax(9rem, 16rem) 1fr 4.6rem; }
  .barrow .flag { width: 34px; height: 24px; }
  .track { height: 14px; background: var(--bg); border-radius: 7px; overflow: hidden; }
  .fill { height: 100%; background: var(--muted); border-radius: 7px; }
  .barrow.expected .fill { background: var(--ok); }
  .barrow.expected .label { font-weight: 700; }
  .count { text-align: right; font-variant-numeric: tabular-nums; }
  @media (max-width: 640px) {
    .barrow, .barrow.withflag { grid-template-columns: 1fr 4.2rem; }
    .barrow .flag { display: none; }
    .barrow .track { grid-column: 1 / 3; grid-row: 2; }
  }
  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 520px; font-size: 1rem; }
  th, td { text-align: left; padding: .55rem .6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 700; }
  .sub { background: var(--surface); border-radius: 8px; padding: 1rem 1.2rem; margin: 0 0 1rem; }
  .sub h3 { margin-bottom: .6rem; }
  .sub dl { display: grid; grid-template-columns: 8rem 1fr; gap: .35rem 1rem; margin: 0; font-size: 1rem; }
  .sub dt { color: var(--muted); font-weight: 700; }
  .sub dd { margin: 0; white-space: pre-wrap; }
  @media (max-width: 600px) { .sub dl { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="bar">
  <div class="brand">A viagem do capitão</div>
  <div class="tabs" id="tabs" role="group" aria-label="Modo">
    <button type="button" data-view="play" aria-pressed="true">Jogar</button>
    <button type="button" data-view="panel" aria-pressed="false">Painel do professor</button>
  </div>
</div>
<nav class="stages" id="stages" aria-label="Etapas"></nav>
<main id="app" aria-live="polite"></main>

<script>
(function () {
  "use strict";

  // =================== Content ===================
  var CITY = "Porto Sereno";
  var MURAL_URL = "https://padlet.com/pedroaurelioabreu/a-familia-lima-machado-a-tripulacao-da-larissa-s024dp5qsj5oiao6viu3";
  var SBC_URL = "https://books-sol.sbc.org.br/index.php/sbc/catalog/download/190/886/1838?inline=1";
  var STAGES = [
    { id: "1", t: "A biblioteca do capitão" },
    { id: "2", t: "O capitão no texto" },
    { id: "3", t: "A tempestade" },
    { id: "3.1", t: "O ciclo do agente" },
    { id: "4", t: "A família Lima Machado" }
  ];

  // Stage 1
  var OPTIONS = {
    A: "Resolve com o que leu na biblioteca",
    B: "Resolve, mas a informação pode estar desatualizada",
    C: "Não resolve: a informação é nova",
    D: "Não resolve: precisa agir, não só saber"
  };
  var KEYS = ["A", "B", "C", "D"];
  var QUESTIONS = [
    { id: "q1", text: "Em que ano foi fundada " + CITY + ", a cidade de destino?", answer: "A",
      boat: "A data de fundação estava nos livros que ele leu antes de partir, e ela não muda com o tempo. Ele resolve de memória." },
    { id: "q2", text: "Qual é a previsão do tempo para amanhã de manhã?", answer: "C",
      boat: "A previsão de amanhã não existia quando o barco partiu. Nenhum livro que ele leu fala dela." },
    { id: "q3", text: "Quem é o prefeito atual de " + CITY + "?", answer: "B",
      boat: "O capitão leu o nome do prefeito da época da partida e responde com segurança. Mas pode ter havido eleição desde então." },
    { id: "q4", text: "O barco faz 20 km por hora. Quanto tempo leva para percorrer os 300 km que faltam?", answer: "A",
      boat: "Ele aprendeu a fazer a conta nos livros: 300 ÷ 20 = 15 horas. Não depende de nenhuma notícia nova." },
    { id: "q5", text: "Houve algum conflito político em " + CITY + " na última semana?", answer: "C",
      boat: "A última semana aconteceu muito depois da partida. Nada do que ele leu fala disso." },
    { id: "q6", text: "Navegar até " + CITY + " pelo melhor caminho possível.", answer: "D",
      boat: "Ele leu os manuais de navegação: sabe como fazer. Mas saber não move o barco. Alguém precisa girar o leme, e alguém precisa ver as ondas de agora.",
      notes: { C: "Você notou algo importante: as condições do mar agora também são informação nova. Mas o problema central é outro: mesmo sabendo tudo, o capitão não move o barco sozinho." } }
  ];

  // Stage 2
  var POLL = [
    { id: "p1", text: "No texto da SBC, quem é o capitão Luís?", answer: "A",
      options: { A: "O LLM, o \u201ccérebro\u201d do agente", B: "Os sensores", C: "Os atuadores", D: "O usuário que faz o pedido" },
      why: "O texto descreve o LLM como o controlador central, o \u201ccérebro\u201d que orquestra os outros módulos. É o papel do Luís: pensar e decidir." },
    { id: "p2", text: "No barco, quem é o sensor?", answer: "B",
      options: { A: "Luís, o capitão", B: "O vigia", C: "O timoneiro", D: "A biblioteca" },
      why: "O sensor percebe o ambiente. No barco, quem observa o tempo e o mar é o vigia." },
    { id: "p3", text: "No barco, quem é o atuador?", answer: "C",
      options: { A: "Luís, o capitão", B: "O vigia", C: "O timoneiro", D: "A biblioteca" },
      why: "O atuador age sobre o ambiente. No barco, quem gira o leme é o timoneiro." }
  ];

  // Stage 3
  var STEPS = {
    P: { name: "Percepção", what: "O agente recebe informação do ambiente: o pedido do usuário, um dado novo, o resultado de uma ferramenta." },
    M: { name: "Memória e contexto", what: "O agente junta o que percebeu com o que já sabe: o histórico da conversa, documentos, o que aconteceu antes." },
    R: { name: "Planejamento e raciocínio", what: "O LLM pesa as opções e decide o próximo passo." },
    F: { name: "Uso de ferramentas", what: "O agente age por meio de ferramentas: uma busca, uma API, um programa, um sistema." },
    O: { name: "Observação e avaliação", what: "O agente observa o resultado da ação e confere se chegou mais perto do objetivo." }
  };
  var CARDS = {
    P: "O vigia avista nuvens escuras a leste, e o vento muda de direção.",
    M: "Luís consulta o diário de bordo: o porto seguro mais próximo ficou a duas horas, ao norte.",
    R: "Luís compara as rotas possíveis e decide desviar para o norte, rumo ao porto.",
    F: "Luís manda o timoneiro virar 30 graus para o norte.",
    O: "O vigia informa que as nuvens estão ficando para trás, e Luís confere se o novo rumo funcionou.",
    X: "Luís lembra da previsão do tempo que leu antes de partir."
  };
  var CANON = ["P", "M", "R", "F", "O"];
  var ALT = ["M", "P", "R", "F", "O"];
  var CYCLE_OPTS = ["P", "M", "R", "F", "O"];
  var CYCLE_ANSWER = "R";
  var CYCLE_NOTES = {
    P: "Quase. O aviso do vigia já é a nova percepção. O que falta agora é decidir de novo.",
    M: "Consultar o diário ajuda, mas não basta: Luís precisa de um plano novo.",
    R: "Com a nova informação, Luís replaneja: talvez outro porto, talvez reduzir a velocidade.",
    F: "Mandar o timoneiro agir sem replanejar repetiria a manobra que não funcionou.",
    O: "A avaliação já aconteceu: foi ela que mostrou o problema. Agora é preciso replanejar."
  };

  // Stage 4
  var FIELDS = [
    { k: "prof", short: "Profissão", label: "Profissão da Larissa", hint: "Escolha uma profissão em que ela planeja e decide, mas outras pessoas percebem e agem. Algumas ideias: administradora de hospital, administradora de eventos.", one: true },
    { k: "nao", short: "Não consegue sozinha", label: "O que a Larissa não consegue fazer sozinha?", hint: "Só com o que leu e planejando, o que fica fora do alcance dela?" },
    { k: "sens", label: "Sensores", hint: "Quem ou o que observa o ambiente de trabalho por ela?" },
    { k: "atu", label: "Atuadores", hint: "Quem ou o que age por ela?" },
    { k: "mem", label: "Memória", hint: "Onde ela guarda o que já aconteceu?" },

  // =================== Helpers ===================
  function flag(key, cls) {
    var c = ' class="flag' + (cls ? " " + cls : "") + '"';
    if (key === "A") return '<svg' + c + ' viewBox="0 0 44 32" aria-hidden="true"><rect width="44" height="32" fill="#1D4E89"/><rect y="6.4" width="44" height="19.2" fill="#fff"/><rect y="12.8" width="44" height="6.4" fill="#C8302A"/></svg>';
    if (key === "B") return '<svg' + c + ' viewBox="0 0 44 32" aria-hidden="true"><rect width="44" height="32" fill="#F2BE1A"/><path d="M0 32 L44 0 L44 32 Z" fill="#1D4E89"/></svg>';
    if (key === "C") {

      for (var r = 0; r < 4; r++) for (var k = 0; k < 4; k++) if ((r + k) % 2 === 0) s += '<rect x="' + (k * 11) + '" y="' + (r * 8) + '" width="11" height="8" fill="#1D4E89"/>';

  }
  function route(progress) {
    var n = QUESTIONS.length, x0 = 40, x1 = 760, y = 54, step = (x1 - x0) / n;
    var s = '<svg class="route" viewBox="0 0 800 100" role="img" aria-label="Viagem: ' + progress + " de " + n + ' problemas resolvidos">';
    s += '<path class="wave" d="M0 96 q20 -8 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0" fill="none" stroke-width="2"/>';
    s += '<line class="path" x1="' + x0 + '" y1="' + y + '" x2="' + x1 + '" y2="' + y + '" stroke-width="2" stroke-dasharray="6 6"/>';
    for (var i = 1; i < n; i++) s += '<circle class="stop' + (i <= progress ? " done" : "") + '" cx="' + (x0 + step * i) + '" cy="' + y + '" r="6" stroke-width="2"/>';
    s += '<circle class="port" cx="' + x1 + '" cy="' + y + '" r="9"/>';
    s += '<text x="' + x1 + '" y="' + (y + 30) + '" text-anchor="end">' + CITY + "</text>";

      '<path class="hull" d="M0 ' + (y - 2) + " L44 " + (y - 2) + " L36 " + (y + 10) + " L8 " + (y + 10) + ' Z"/>' +
      '<path class="sail" d="M22 ' + (y - 36) + " L22 " + (y - 6) + " L40 " + (y - 6) + ' Z" stroke-width="2"/>' +
      '<path class="sail" d="M19 ' + (y - 28) + " L19 " + (y - 6) + " L6 " + (y - 6) + ' Z" stroke-width="2"/></g>';
    return s + "</svg>";
  }
  function cycleSvg(hot) {
    var cx = 280, cy = 190, r = 120, keys = CANON;
    var angles = [-90, -18, 54, 126, 198];
    function pt(a, rad) { var t = a * Math.PI / 180; return [cx + rad * Math.cos(t), cy + rad * Math.sin(t)]; }
    var s = '<svg class="cycle" viewBox="-90 0 740 380" role="img" aria-label="Ciclo do agente: percepção, memória e contexto, planejamento e raciocínio, uso de ferramentas, observação e avaliação, e de volta à percepção">';
    s += '<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0 L10 5 L0 10 Z"/></marker></defs>';
    for (var i = 0; i < 5; i++) {
      var a1 = angles[i] + 11, a2 = angles[(i + 1) % 5] - 11;
      if (a2 < a1) a2 += 360;
      var p1 = pt(a1, r), p2 = pt(a2, r);
      s += '<path class="ring" d="M' + p1[0].toFixed(1) + " " + p1[1].toFixed(1) + " A" + r + " " + r + " 0 0 1 " + p2[0].toFixed(1) + " " + p2[1].toFixed(1) + '" stroke-width="2.5" marker-end="url(#ah)"/>';
    }
    var anchors = ["middle", "start", "start", "end", "end"];
    var offs = [[0, -22], [18, 5], [14, 22], [-14, 22], [-18, 5]];
    for (var j = 0; j < 5; j++) {
      var p = pt(angles[j], r);
      s += '<circle class="node' + (keys[j] === hot ? " hot" : "") + '" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="10"/>';
      s += '<text x="' + (p[0] + offs[j][0]).toFixed(1) + '" y="' + (p[1] + offs[j][1]).toFixed(1) + '" text-anchor="' + anchors[j] + '">' + STEPS[keys[j]].name + "</text>";
    }
    s += '<text class="center" x="' + cx + '" y="' + (cy + 8) + '" text-anchor="middle">agente</text>';
    return s + "</svg>";
  }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function same(a, b) { if (!a || !b || a.length !== b.length) return false; for (var i = 0; i < a.length; i++) if (a[i] !== b[i]) return false; return true; }
  function clone(o) { return JSON.parse(JSON.stringify(o || {})); }
  function correctCount(ans) { var c = 0; QUESTIONS.forEach(function (q) { if (ans && ans[q.id] === q.answer) c++; }); return c; }
  function answeredCount(ans) { var c = 0; QUESTIONS.forEach(function (q) { if (ans && ans[q.id]) c++; }); return c; }
  function pollCorrect(p) { var c = 0; POLL.forEach(function (q) { if (p && p[q.id] === q.answer) c++; }); return c; }

  // =================== State ===================
  var LS_KEY = "viagem-capitao-v3";

  var rec = {};           // what gets saved for this student

  var lsUid = null, lsRound = null;
  (function loadLocal() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) {
        var o = JSON.parse(raw);
        rec = o.rec || {};
        si = typeof o.si === "number" ? Math.min(Math.max(o.si, 0), STAGES.length - 1) : 0;
        lsUid = o.uid || null; lsRound = (o.round === undefined) ? null : o.round;
      }

  })();
  function persistLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify({ rec: rec, si: si, uid: lsUid, round: lsRound })); } catch (e) {} }

  var game, poll, storm, cyc, form;
  function freshGame() { return { phase: "intro", i: 0, answers: {} }; }
  function freshStorm() { return { pool: shuffle(["P", "M", "R", "F", "O", "X"]), seq: [], checks: 0, result: null }; }
  function initStorm() {
    var st = rec.storm || {};
    if (st.final) return { pool: [], seq: st.final.slice(), checks: st.checks || 1, result: "revealed" };
    return freshStorm();
  }
  function initAll(keepGame) {
    if (!keepGame || !game) game = freshGame();
    poll = { picks: clone(rec.poll), shown: !!rec.poll };

  }
  initAll(false);

  var db = null, user = null, downloads = null, uid = null, isOwner = false;
  var canSave = false, saveFailed = false, connected = false;

  var votes = [], votesError = false, votesLoaded = false, unsubVotes = null;
  var confirmReset = false, resetting = false;

  function save() {

      .catch(function () { saveFailed = true; canSave = false; if (view === "play") renderStatus(); });
  }

  function statusText() {

  }

  // =================== Stage navigation ===================
  function stageDone(id) {
    if (id === "1") return !!rec.finished;
    if (id === "2") return !!rec.poll;

  }
  function renderStages() {

  function goStage(i) { si = i; persistLocal(); render(); focusMain(); }
  function nextStageBtn() {

  }
  function restartBtn() { return '<button class="btn ghost" type="button" data-restart="1">Recomeçar esta etapa</button>'; }

  function wireRestart(reset) {

  function keepScroll() { var y = window.scrollY; render(); window.scrollTo(0, y); }

  // =================== Stage 1 ===================
  function renderIntro() {
    var legend = KEYS.map(function (k) { return "<li>" + flag(k) + "<span>" + OPTIONS[k] + "</span></li>"; }).join("");
    app.innerHTML = route(0) +
      "<h1>A biblioteca<br>do capitão</h1>" +
      '<p class="lead">O capitão Luís Lima Machado partiu há muito tempo rumo a ' + CITY + ". Antes de zarpar, ele leu uma super biblioteca inteira, com praticamente tudo o que se sabia no dia da partida.</p>" +
      "<p>A biblioteca ficou no porto. Durante a viagem, ele responde de memória, com base no que leu, e desde então não leu nada novo. Agora aparecem seis problemas. Para cada um, decida se o que ele leu resolve. Cada resposta tem a sua bandeira:</p>" +
      '<ul class="legend">' + legend + "</ul>" +

  function renderQuestion() {
    var q = QUESTIONS[game.i], chosen = game.answers[q.id], answered = !!chosen;
    var opts = KEYS.map(function (k) {
      var cls = "opt", tag = "";

    }

      '<ul class="lessons">' +
      "<li>" + flag("C") + "<div><h3>Conhecimento congelado</h3><p>A leitura parou no dia da partida. Tudo o que veio depois fica de fora.</p></div></li>" +

  function restartLibrary() {

  // =================== Stage 2 ===================
  function renderPoll() {
    var shown = poll.shown;
    var qs = POLL.map(function (q) {
      var pick = poll.picks[q.id];
      var opts = ["A", "B", "C", "D"].map(function (k) {

          if (k === q.answer) { cls += " right"; tag = '<span class="tag">Resposta esperada</span>'; }

  // =================== Stage 3 ===================
  function renderStorm() {

    }

      (storm.pool.length ? '<p class="label-sm">' + (full ? "Caixinha que sobrou" : "Caixinhas soltas: clique para colocar na sequência") + '</p><ul class="pool">' + poolHtml + "</ul>" : "") +

      '<div class="actions"><button class="btn" type="button" id="check"' + (full ? "" : " disabled") + ">Conferir a ordem</button>" +

      (storm.seq.length || storm.checks ? restartBtn() : "") +
      (full ? "" : '<span class="muted">Coloque cinco caixinhas na sequência.</span>') + "</div>" + footer();

    function rerender(focusSel) {
      keepScroll();

      });
    });
    Array.prototype.forEach.call(app.querySelectorAll("[data-up]"), function (b) {
      b.addEventListener("click", function () { var i = +b.getAttribute("data-up"); var t = storm.seq[i - 1]; storm.seq[i - 1] = storm.seq[i]; storm.seq[i] = t; storm.result = null; rerender('[data-up="' + (i - 1) + '"]'); });
    });
    Array.prototype.forEach.call(app.querySelectorAll("[data-down]"), function (b) {
      b.addEventListener("click", function () { var i = +b.getAttribute("data-down"); var t = storm.seq[i + 1]; storm.seq[i + 1] = storm.seq[i]; storm.seq[i] = t; storm.result = null; rerender('[data-down="' + (i + 1) + '"]'); });

        return roundP.then(function (round) {

            var remote = snap.exists ? (snap.data() || {}) : null;

              Object.keys(rec).forEach(function (k) { if (merged[k] === undefined) merged[k] = rec[k]; });

        });
      });

      var typing = document.activeElement && document.activeElement.tagName === "TEXTAREA";
      if (!typing) keepScroll(); else renderStatus();
    });
  }
})();
